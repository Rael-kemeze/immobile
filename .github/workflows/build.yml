name: Build APK + AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.28.3

      - name: Create .env
        run: |
          cat > .env << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          EOF

      - name: Build APK + AAB
        run: |
          # 1. Build APK (crée le dossier android/)
          flet build apk --org com.immobile.cameroun --project immobile --verbose
          # 2. Build AAB (beaucoup plus léger pour Play Store)
          flet build app --org com.immobile.cameroun --project immobile --verbose || true
          # Si flet build app ne fait pas AAB, on le fait avec Flutter directement
          if [ ! -f build/*.aab ] && [ ! -f build/**/*.aab ]; then
            echo "Build AAB via Flutter..."
            cd build
            flutter build appbundle --release --no-tree-shake-icons || true
            cd ..
          fi
          echo "=== Fichiers générés ==="
          find build -type f \( -name "*.apk" -o -name "*.aab" \) -exec ls -lh {} \;

      - name: Keep only arm64 APK
        run: |
          find build -name "*.apk" ! -name "*arm64*" -delete 2>/dev/null || true
          find build -name "*.apk" -type f -exec ls -lh {} \;
          find build -name "*.aab" -type f -exec ls -lh {} \;

      - name: Upload APK arm64 (110 Mo - test direct)
        uses: actions/upload-artifact@v4
        with:
          name: immobile-APK-arm64-110Mo
          path: build/**/*arm64*.apk
          if-no-files-found: warn
          retention-days: 3

      - name: Upload AAB (70 Mo - Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: immobile-AAB-70Mo-PlayStore
          path: build/**/*.aab
          if-no-files-found: error
          retention-days: 7
