name: Build APK <100Mo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.28.3

      - name: Create .env
        run: |
          cat > .env << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          EOF

      - name: Build APK 1 - create android folder
        run: flet build apk --org com.immobile.cameroun --project immobile

      - name: Enable shrink to go under 100Mo
        run: |
          GRADLE_FILE=$(find build -name "build.gradle" | grep "app/build.gradle" | head -1)
          echo "Gradle: $GRADLE_FILE"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/minifyEnabled false/minifyEnabled true/g' $GRADLE_FILE || true
            sed -i 's/shrinkResources false/shrinkResources true/g' $GRADLE_FILE || true
            if ! grep -q "minifyEnabled true" $GRADLE_FILE; then
              sed -i '/release {/a \            minifyEnabled true\n            shrinkResources true' $GRADLE_FILE
            fi
            echo "--- R8 activé ---"
            grep -A3 "release {" $GRADLE_FILE | head -10
          fi
          mkdir -p build/app/src/main 2>/dev/null || true
          touch build/app/proguard-rules.pro 2>/dev/null || true

      - name: Build APK 2 - optimized <100Mo
        run: |
          flet build apk --org com.immobile.cameroun --project immobile --verbose
          find build -name "*.apk" -type f -exec ls -lh {} \;
          # Garde seulement arm64
          find build -name "*.apk" ! -name "*arm64*" -delete 2>/dev/null || true
          echo "=== FINAL ==="
          find build -name "*.apk" -type f -exec ls -lh {} \;
          APK=$(find build -name "*arm64*.apk" | head -1)
          if [ -n "$APK" ]; then
            SIZE=$(stat -c%s "$APK")
            echo "Taille: $(echo "scale=1; $SIZE/1024/1024" | bc) Mo"
          fi

      - name: Upload APK <100Mo
        uses: actions/upload-artifact@v4
        with:
          name: immobile-APK-arm64
          path: build/**/*arm64*.apk
          if-no-files-found: error
          retention-days: 3
