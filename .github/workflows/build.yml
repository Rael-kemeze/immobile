name: créer-apk
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install system deps and Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev || true
          yes | flutter doctor --android-licenses || true
          flutter doctor -v
          python -m pip install --upgrade pip
          pip install flet==0.27.1 pyinstaller==6.10.0 supabase==2.9.1 python-dotenv==1.0.1 cloudinary Pillow httpx requests

      - name: Fix pyproject.toml - SANS espaces
        run: |
          python3 << 'PY'
          content = """[project]
          name = "immobile"
          version = "1.0.1"
          description = "IMMOBILE Cameroun"
          requires-python = ">=3.9"
          dependencies = ["flet==0.27.1","supabase==2.9.1","python-dotenv==1.0.1","cloudinary","Pillow"]

          [tool.flet]
          org = "com.immobile.cameroun"
          project = "immobile"
          description = "IMMOBILE"
          main = "main.py"
          assets_dir = "assets"
          """
          open("pyproject.toml","w",encoding="utf-8").write(content)
          print("=== pyproject.toml ===")
          print(open("pyproject.toml",encoding="utf-8").read())
          PY

      - name: Create .env from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_KEY=$SUPABASE_KEY
          SUPABASE_BUCKET=biens
          CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME
          CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY
          CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET
          CLOUDINARY_FOLDER=immobile
          OTP_MODE=disabled
          ENABLE_MONETIZATION=false
          EOF
          echo "=== .env et assets ==="
          ls -la assets/ || echo "Pas d'assets"
          ls -la main.py pyproject.toml .env

      - name: Build APK avec --project immobile
        run: |
          flet --version
          echo "Building avec --project immobile pour forcer le nom"
          flet build apk --project immobile --product "IMMOBILE" --verbose 2>&1 | tee build.log
          echo "=== FIN BUILD ==="
          echo "=== Recherche APK ==="
          find . -name "*.apk" -type f -exec ls -lh {} \;
          ls -Rlh build/ 2>/dev/null | tail -20
          echo "=== Fin log ==="
          tail -50 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: immobile-apk
          path: |
            **/*.apk
            build.log
          if-no-files-found: error
          retention-days: 7
