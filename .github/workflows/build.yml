name: créer-apk
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev || true
          yes | flutter doctor --android-licenses || true
          pip install flet==0.28.3 supabase python-dotenv cloudinary Pillow httpx

      # Flet empaquette TOUT le dossier du projet dans l'APK.
      # On retire ici ce qui n'a rien a faire dans l'application.
      - name: Nettoyer le projet avant packaging
        run: |
          rm -rf source venv .venv uploads assets/uploads local_db.json \
                 main_mobile.py migrate_to_supabase.py reset_admin.py \
                 supabase_schema.sql "Supabase-Schema-Final (1).sql" \
                 MD5SUMS.txt requirements.txt
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          echo "=== Taille du projet a empaqueter ==="
          du -sh --exclude=.git .
          ls -la

      # Les secrets sont ecrits dans services/app_env.py (un .py est toujours
      # embarque dans l'APK, contrairement a un fichier cache .env) et dans .env.
      # On n'ecrit plus de copie dans assets/ et on n'affiche plus .env dans les logs.
      - name: Create secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os
          env = {k: os.environ.get(k, "") for k in (
              "SUPABASE_URL", "SUPABASE_KEY", "CLOUDINARY_CLOUD_NAME",
              "CLOUDINARY_API_KEY", "CLOUDINARY_API_SECRET")}
          if not env["SUPABASE_URL"] or not env["SUPABASE_KEY"]:
              raise SystemExit("ERREUR : secrets SUPABASE_URL / SUPABASE_KEY absents dans GitHub")
          env.update({"SUPABASE_BUCKET": "biens", "CLOUDINARY_FOLDER": "immobile", "OTP_MODE": "disabled"})
          with open("services/app_env.py", "w", encoding="utf-8") as f:
              f.write("ENV = " + json.dumps(env, ensure_ascii=False, indent=2) + "\n")
          with open(".env", "w", encoding="utf-8") as f:
              f.write("".join(f"{k}={v}\n" for k, v in env.items()))
          print("OK : services/app_env.py et .env generes (valeurs non affichees)")
          PY

      - name: Build APK
        shell: bash
        run: |
          # --split-per-abi : un APK par architecture CPU (bien plus leger qu'un APK universel)
          flet build apk --project immobile --split-per-abi --verbose 2>&1 | tee build.log
          echo "=== APK TROUVÉS ==="
          find . -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: immobile-apk
          path: build/**/*.apk
          if-no-files-found: error
