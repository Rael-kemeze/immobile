name: créer-apk
on:
  push:
    branches: [ main, principal ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: List files
        run: |
          ls -la
          ls -lh main.py pyproject.toml

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v || true

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install flet==0.27.1 pyinstaller==6.10.0
          pip install supabase==2.9.1 python-dotenv==1.0.1 cloudinary Pillow httpx requests python-dateutil

      - name: Create .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_KEY=$SUPABASE_KEY
          SUPABASE_BUCKET=biens
          CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME
          CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY
          CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET
          CLOUDINARY_FOLDER=immobile
          OTP_MODE=disabled
          ENABLE_MONETIZATION=false
          EOF

      - name: Fix pyproject.toml
        run: |
          cat > pyproject.toml <<'PYEOF'
          [project]
          name = "immobile"
          version = "1.0.1"
          dependencies = ["flet==0.27.1","supabase==2.9.1","python-dotenv==1.0.1","cloudinary","Pillow","requests","httpx"]

          [tool.flet]
          org = "com.immobile.cameroun"
          project = "IMMOBILE"
          main = "main.py"
          assets_dir = "assets"
          PYEOF

      - name: Build APK
        run: flet build apk --project . --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: immobile-apk
          path: |
            build/**/*.apk
            **/*.apk
          if-no-files-found: warn
          retention-days: 7
