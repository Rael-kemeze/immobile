name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.28.3

      - name: Create .env
        run: |
          cat > .env << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          EOF

      - name: Build APK
        run: flet build apk --org com.immobile.cameroun --project immobile --verbose

      - name: List and keep only arm64
        run: |
          echo "=== Tous les APKs ==="
          find build -type f -name "*.apk" -exec ls -lh {} \;
          # Supprime tout sauf arm64
          find build -type f -name "*.apk" ! -name "*arm64*" -delete 2>/dev/null || true
          echo "=== Après filtre arm64 ==="
          find build -type f -name "*.apk" -exec ls -lh {} \;
          # Si pas de arm64 dans le nom (parfois c'est juste app-release.apk), garde le plus gros
          if [ -z "$(find build -name "*.apk")" ]; then
            echo "Pas d'arm64 trouvé, on garde tout"
            flet build apk --org com.immobile.cameroun --project immobile || true
            find build -type f -name "*.apk" -exec ls -lh {} \;
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: immobile-APK
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 3
