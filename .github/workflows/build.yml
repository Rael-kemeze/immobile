name: Build IMMOBILE APK - 110Mo + Fix White Screen
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install flet==0.27.1 python-dotenv supabase==2.9.1 cloudinary pillow httpx python-dateutil
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Create .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_KEY=$SUPABASE_KEY
          SUPABASE_BUCKET=biens
          CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME
          CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY
          CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET
          CLOUDINARY_FOLDER=immobile
          OTP_MODE=disabled
          ENABLE_MONETIZATION=false
          EOF
      - name: Build APK
        run: |
          flet build apk --verbose --include-packages flet-embed || flet build apk --verbose
          find build -name "*.apk" -exec ls -lh {} \;
      - name: Fix 110Mo
        run: |
          rm -rf [STRIPPED 69 bytes] 2>/dev/null || true
          find build -type d -name "*armeabi*" -exec rm -rf {} + 2>/dev/null || true
          find build -type d -name "*x86*" -exec rm -rf {} + 2>/dev/null || true
          find build -type f -name "*.apk" -exec ls -lh {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: immobile-APK-110Mo
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 7
