name: Build IMMOBILE APK - Fix Claude
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache python standalone
        uses: actions/cache@v4
        with:
          path: /tmp/hostpython*
          key: python-3.11-standalone
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install flet==0.27.1 python-dotenv supabase==2.9.1 cloudinary pillow httpx
      - name: Create .env (PAS dans assets !)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_KEY=$SUPABASE_KEY
          SUPABASE_BUCKET=biens
          CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME
          CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY
          CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET
          CLOUDINARY_FOLDER=immobile
          EOF
      - name: Build APK split-per-abi (1 APK = 1 arch = 40Mo au lieu de 120Mo)
        run: |
          flet build apk --split-per-abi --verbose || flet build apk --verbose
          find build -name "*.apk" -exec ls -lh {} \;
      - name: Fix 110Mo - garde que arm64
        run: |
          find build -type d -name "*armeabi*" -exec rm -rf {} + 2>/dev/null || true
          find build -type d -name "*x86*" -exec rm -rf {} + 2>/dev/null || true
          find build -name "*.apk" -exec ls -lh {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: immobile-APK-FIX-CLAUDE
          path: build/**/*.apk
          if-no-files-found: error
