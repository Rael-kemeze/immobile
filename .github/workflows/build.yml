name: Build IMMOBILE APK - GitHub Method
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter 3.22.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.6'
          channel: 'stable'
          cache: true
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.27.1
          pip install python-dotenv supabase==2.9.1 cloudinary pillow httpx python-dateutil || true
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Create .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_KEY=$SUPABASE_KEY
          SUPABASE_BUCKET=biens
          CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME
          CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY
          CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET
          CLOUDINARY_FOLDER=immobile
          OTP_MODE=disabled
          ENABLE_MONETIZATION=false
          EOF
      - name: Build APK
        run: |
          flet build apk --verbose
          ls -lh build/ || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: immobile-apk
          path: |
            build/**/*.apk
            **/*.apk
          if-no-files-found: warn
          retention-days: 7
