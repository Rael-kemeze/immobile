name: Build APK 110Mo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true
      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet==0.28.3
      - name: Create .env
        run: |
          cat > .env << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          EOF
      - name: Build APK
        run: flet build apk --org com.immobile.cameroun --project immobile --verbose
      - name: DEBUG + DELETE pour passer de 340Mo à 110Mo
        run: |
          echo "=== AVANT (devrait être 3 APK = 340Mo) ==="
          find build -type f -name "*.apk" | xargs ls -lh
          du -sh build
          echo ""
          echo "=== SUPPRESSION armeabi + x86_64 ==="
          find build -type f -name "*armeabi*" -print -delete
          find build -type f -name "*x86*" -print -delete
          find build -type f -name "*x64*" -print -delete
          # Garde seulement arm64
          echo ""
          echo "=== APRES (devrait être 1 APK = 110Mo) ==="
          find build -type f -name "*.apk" | xargs ls -lh
          du -sh build
          echo ""
          echo "Taille finale:"
          APK=$(find build -type f -name "*.apk" | head -1)
          ls -lh $APK
          echo "Size Mo: $(du -m $APK | cut -f1)"
      - name: Upload 1 APK ONLY
        uses: actions/upload-artifact@v4
        with:
          name: immobile-110Mo-1APK
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 3
